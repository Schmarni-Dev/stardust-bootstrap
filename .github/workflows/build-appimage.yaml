name: Build AppImage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_DIR: "/tmp/cargo_target"
jobs:
  build:
    strategy:
      matrix:
        openxr_build: [static, dynamic]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - openxr_build: static
            server_flags: "-F openxr_static"
            bin_suffix: "-static_openxr"
            # sccache seems to cause openxr to not statically link but instead still build the dyn loading one?
            server_env_vars: "SCCACHE_GHA_ENABLED=\"false\" RUSTC_WRAPPER=\"\""
          - openxr_build: dynamic
          # the mimalloc feature causes segfaults in the static build on x86_64
          - arch: x86_64
            openxr_build: static
            server_flags: "--no-default-features -F openxr_static"
          
    runs-on: ${{matrix.runner}}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Stardust/Rust/Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libfontconfig1-dev libvulkan1 libxkbcommon-dev xwayland libwayland-dev libx11-dev libasound2-dev libxkbcommon-x11-0 libopenxr-dev libxkbcommon-x11-dev libxcb-cursor-dev desktop-file-utils just libudev-dev libinput-dev

      - name: Download appimagetool
        run: |
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage -O appimagetool
          chmod +x appimagetool
      - name: Build AppDir
        run: just server_cargo_flags="${{matrix.server_flags}}" telescope_appdir="$PWD/Telescope-${{ matrix.arch }}${{ matrix.bin_suffix }}.AppDir" appdir-telescope

      - name: Build AppImage
        run: |
          ./appimagetool "Telescope-${{ matrix.arch }}${{ matrix.bin_suffix }}.AppDir" Telescope-${{ matrix.arch }}${{ matrix.bin_suffix }}.AppImage

      - name: Upload AppDir
        uses: actions/upload-artifact@v7
        with:
          name: Telescope-${{ matrix.arch }}${{ matrix.bin_suffix }}.AppDir
          path: Telescope-${{ matrix.arch }}${{ matrix.bin_suffix }}.AppDir

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: Telescope-${{ matrix.arch }}${{ matrix.bin_suffix }}.AppImage
          path: Telescope-${{ matrix.arch }}${{ matrix.bin_suffix }}.AppImage

      - name: Upload AppImage to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Telescope-${{ matrix.arch }}-${{ matrix.bin_suffix }}.AppImage

